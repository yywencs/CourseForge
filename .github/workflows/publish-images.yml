name: Publish images

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: publish-images-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ${{ vars.ACR_REGISTRY }}
  NAMESPACE: ${{ vars.ACR_NAMESPACE }}
  IMAGE_TAG: ${{ github.ref_name }}

jobs:
  validate-tag:
    name: Validate version tag
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Validate semantic version
        shell: bash
        run: |
          [[ "${IMAGE_TAG}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] \
            || { echo "invalid release tag: ${IMAGE_TAG}"; exit 1; }

  check:
    name: Backend Check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run formatting, vet, and tests
        run: make check

  frontend-check:
    name: Frontend Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Check generated Protobuf code
        run: npm run proto:check

      - name: Run frontend type checks
        run: npm run typecheck

      - name: Run frontend unit tests
        run: npm run test:run

      - name: Build frontend
        run: npm run build

  frontend-e2e:
    name: Frontend E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run frontend end-to-end tests
        run: npm run test:e2e

  integration-test:
    name: Backend Integration Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run integration tests
        run: make integration-test

  publish:
    name: Publish ${{ matrix.image }}
    needs:
      - validate-tag
      - check
      - frontend-check
      - frontend-e2e
      - integration-test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: courseforge-api
            context: .
            dockerfile: ./Dockerfile
            target: api
          - image: courseforge-admin
            context: .
            dockerfile: ./Dockerfile
            target: admin
          - image: courseforge-web
            context: ./web
            dockerfile: ./web/Dockerfile
            target: runtime

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate registry configuration
        env:
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
        run: |
          test -n "${REGISTRY}" || { echo "ACR_REGISTRY repository variable is missing"; exit 1; }
          test -n "${NAMESPACE}" || { echo "ACR_NAMESPACE repository variable is missing"; exit 1; }
          test -n "${ACR_USERNAME}" || { echo "ACR_USERNAME repository secret is missing"; exit 1; }
          test -n "${ACR_PASSWORD}" || { echo "ACR_PASSWORD repository secret is missing"; exit 1; }

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Alibaba Cloud ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ matrix.image }}:${{ env.IMAGE_TAG }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.IMAGE_TAG }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
